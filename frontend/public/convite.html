<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ative seu acesso | CDS Contábil Connect</title><style>body{font-family:Georgia,serif;background:#eef2f1;color:#182522;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#fff;max-width:520px;width:calc(100% - 32px);padding:32px;border:1px solid #d8e0dc;box-shadow:0 12px 30px #16352a14}h1{margin-top:0}label{display:block;margin:14px 0 6px;font:600 14px Arial,sans-serif}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b9c8c1;border-radius:4px;font-size:16px}button{margin-top:20px;background:#166b4a;color:white;border:0;cursor:pointer}small{font-family:Arial,sans-serif;color:#5e6d66}.error{color:#a33;margin-top:16px}.ok{color:#17613f;margin-top:16px}</style></head><body><main class="card"><p><strong>CDS CONTÁBIL CONNECT</strong></p><h1 id="title">Ative seu acesso</h1><div id="details">Validando convite...</div><form id="form" hidden><label for="name">Nome</label><input id="name" name="name" required><label for="password">Senha</label><input id="password" name="password" type="password" minlength="8" required><label for="confirmation">Confirmar senha</label><input id="confirmation" name="confirmation" type="password" minlength="8" required><button>Ativar minha conta</button></form><div id="message"></div></main><script>
const token=location.pathname.split('/').pop(),details=document.querySelector('#details'),form=document.querySelector('#form'),message=document.querySelector('#message'),title=document.querySelector('#title');
function showError(text){title.textContent='Convite';details.textContent=text;form.hidden=true;message.className='error';message.textContent='';}
fetch('/api/invitations/'+encodeURIComponent(token)).then(async r=>{const x=await r.json();if(r.ok){title.textContent=x.title||'Ative seu acesso';details.innerHTML='<p>Você foi convidado para acessar os dados de <b>'+x.company+'</b> pelo escritório <b>'+x.tenant+'</b>.</p><p>E-mail: <b>'+x.email+'</b></p>';form.hidden=false;form.name.value=x.name;return}showError(x.message||'Não foi possível validar este convite.')}).catch(()=>showError('Não foi possível validar este convite.'));
form.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form));const r=await fetch('/api/invitations/'+encodeURIComponent(token)+'/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();if(!r.ok){message.className='error';message.textContent=x.message||'Não foi possível validar este convite.';return}localStorage.setItem('ccc_token',x.token);message.className='ok';message.textContent='Conta ativada com sucesso. Redirecionando...';setTimeout(()=>location.href=x.redirect||'/portal/',400)}
</script></body></html>
